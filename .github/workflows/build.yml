name: VScoder Build — APK & AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK & AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Check if signing secrets are available ────────────────
      - name: Check signing secrets
        id: secrets
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✅ Keystore secret found — building SIGNED release"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠️  No keystore secret — building DEBUG (unsigned)"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 3. Node.js + CodeMirror 6 Bundle ────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install editor dependencies
        working-directory: editor_src
        run: npm install

      - name: Build CodeMirror 6 bundle
        working-directory: editor_src
        run: npm run build

      # ── 4. Download JetBrains Mono fonts ────────────────────────
      - name: Download JetBrains Mono fonts
        run: |
          mkdir -p assets/fonts
          BASE="https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf"
          curl -sL "$BASE/JetBrainsMono-Regular.ttf" -o assets/fonts/JetBrainsMono-Regular.ttf
          curl -sL "$BASE/JetBrainsMono-Bold.ttf"    -o assets/fonts/JetBrainsMono-Bold.ttf
          curl -sL "$BASE/JetBrainsMono-Italic.ttf"  -o assets/fonts/JetBrainsMono-Italic.ttf
          echo "✅ Fonts downloaded"

      # ── 5. Java ──────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 6. Flutter ───────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ── 7. Setup keystore for SIGNED build ──────────────────────
      - name: Setup keystore
        if: steps.secrets.outputs.has_keystore == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/vscoder-release.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=vscoder-release.jks
          EOF
          echo "✅ Keystore configured"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS:   ${{ secrets.STORE_PASSWORD }}
          KEY_PASS:     ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.KEY_ALIAS }}

      # ── 8. Build APK ─────────────────────────────────────────────
      - name: Build APK (signed release)
        if: steps.secrets.outputs.has_keystore == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build APK (debug — no keystore)
        if: steps.secrets.outputs.has_keystore == 'false'
        run: flutter build apk --debug --split-per-abi

      # ── 9. Build AAB ─────────────────────────────────────────────
      - name: Build AAB (signed release)
        if: steps.secrets.outputs.has_keystore == 'true'
        run: flutter build appbundle --release

      - name: Build AAB (debug — no keystore)
        if: steps.secrets.outputs.has_keystore == 'false'
        run: flutter build appbundle --debug

      # ── 10. Upload build artifacts ───────────────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: VScoder-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VScoder-AAB
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 30

      # ── 11. Create GitHub Release ────────────────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VScoder v${{ github.run_number }}
          body: |
            ## VScoder Build #${{ github.run_number }}

            **Commit:** ${{ github.sha }}
            **Signed:** ${{ steps.secrets.outputs.has_keystore == 'true' && 'Yes ✅' || 'No (debug) ⚠️' }}

            ### Install APK directly
            1. Download `app-arm64-v8a-*.apk` (recommended for modern phones)
            2. Or `app-armeabi-v7a-*.apk` for older phones
            3. Enable **Install from unknown sources** in Android settings
            4. Install and enjoy VScoder!

            ### Play Store
            Upload `app-release.aab` to Google Play Console.
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
