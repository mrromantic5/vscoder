name: VScoder Build — APK & AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK & AAB
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. Node.js + CodeMirror 6 Bundle ─────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editor_src/package-lock.json

      - name: Install editor dependencies
        working-directory: editor_src
        run: npm ci

      - name: Build CodeMirror 6 bundle
        working-directory: editor_src
        run: npm run build

      # ─── 3. Download JetBrains Mono font ──────────────────────────
      - name: Download JetBrains Mono fonts
        run: |
          mkdir -p assets/fonts
          curl -L "https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf/JetBrainsMono-Regular.ttf" \
            -o assets/fonts/JetBrainsMono-Regular.ttf
          curl -L "https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf/JetBrainsMono-Bold.ttf" \
            -o assets/fonts/JetBrainsMono-Bold.ttf
          curl -L "https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf/JetBrainsMono-Italic.ttf" \
            -o assets/fonts/JetBrainsMono-Italic.ttf

      # ─── 4. Java ───────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ─── 5. Flutter ────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ─── 6. Keystore Setup (for signed build) ─────────────────────
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vscoder-release.jks

      - name: Create key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=vscoder-release.jks
          EOF

      # ─── 7. Build APK ──────────────────────────────────────────────
      - name: Build APK (debug — no keystore needed)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: flutter build apk --debug --split-per-abi

      - name: Build APK (release — signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release --split-per-abi

      # ─── 8. Build AAB ──────────────────────────────────────────────
      - name: Build AAB (debug)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: flutter build appbundle --debug

      - name: Build AAB (release — signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release

      # ─── 9. Upload Artifacts ───────────────────────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: VScoder-APKs
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VScoder-AAB
          path: |
            build/app/outputs/bundle/**/*.aab
          retention-days: 30

      # ─── 10. Create GitHub Release (on push to main) ──────────────
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VScoder v${{ github.run_number }}
          body: |
            ## VScoder Build #${{ github.run_number }}
            
            **Commit:** ${{ github.sha }}
            
            ### Downloads
            - `app-arm64-v8a-release.apk` → Modern Android (64-bit) ✅ Recommended
            - `app-armeabi-v7a-release.apk` → Older Android (32-bit)
            - `app-release.aab` → Google Play Store upload
            
            ### Install APK
            1. Download the APK for your device architecture
            2. Enable "Install from unknown sources" in Android settings
            3. Install and enjoy VScoder!
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
