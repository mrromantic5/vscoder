name: vscoder
description: VScoder — Professional Mobile Code Editor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView — CodeMirror 6 editor engine
  flutter_inappwebview: ^6.1.5

  # Local database for projects & files
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Device file access
  file_picker: ^8.1.4
  permission_handler: ^11.3.1

  # Local HTTP server for running web projects
  shelf: ^1.4.1
  shelf_static: ^1.1.2

  # State management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  archive: ^3.6.1
  mime: ^1.0.5

  # UI
  flutter_animate: ^4.5.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/editor/
    - assets/runner/
    - assets/fonts/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
